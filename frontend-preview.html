<!doctype html>
<html lang="vi-VN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoa Chưa Nở - Chế độ chủ tiệm</title>
    <style>
      :root {
        --text: #f7ecdc;
        --muted: rgba(247, 236, 220, 0.66);
        --dim: rgba(247, 236, 220, 0.42);
        --line: rgba(247, 236, 220, 0.2);
        --line-strong: rgba(247, 236, 220, 0.42);
        --black: rgba(7, 5, 4, 0.66);
        --black-soft: rgba(7, 5, 4, 0.36);
        --gold: #d7b36d;
        --tea: #80aa9c;
        --rose: #c78875;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #0f0a07;
        color: var(--text);
        overflow: hidden;
      }

      button {
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .play-screen {
        position: relative;
        width: min(1366px, 100%);
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        overflow: hidden;
        background: #0b0806;
        isolation: isolate;
      }

      .scene-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.86) contrast(1.04) brightness(0.72);
        transform: scale(1.02);
        transition:
          filter 220ms ease,
          transform 220ms ease;
      }

      .mode-menu .scene-bg {
        filter: saturate(0.68) contrast(0.96) brightness(0.46) blur(5px);
        transform: scale(1.04);
      }

      .shade,
      .steam,
      .hud-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .shade {
        z-index: 1;
        background:
          radial-gradient(circle at 52% 42%, rgba(255, 222, 180, 0.16), transparent 23rem),
          linear-gradient(90deg, rgba(5, 4, 3, 0.72), rgba(5, 4, 3, 0.12) 50%, rgba(5, 4, 3, 0.64)),
          linear-gradient(180deg, rgba(5, 4, 3, 0.16), rgba(5, 4, 3, 0.7));
      }

      .steam {
        z-index: 2;
        opacity: 0.34;
        background:
          radial-gradient(ellipse at 34% 78%, rgba(255, 236, 204, 0.2), transparent 19rem),
          radial-gradient(ellipse at 72% 70%, rgba(128, 170, 156, 0.16), transparent 18rem);
        animation: steamMove 8s ease-in-out infinite alternate;
      }

      @keyframes steamMove {
        from {
          opacity: 0.24;
          transform: translateY(8px);
        }
        to {
          opacity: 0.38;
          transform: translateY(-8px);
        }
      }

      .hud-lines {
        z-index: 3;
        opacity: 0.32;
      }

      .corner-brand {
        position: absolute;
        top: 2rem;
        left: 2.25rem;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 0.72rem;
        color: rgba(247, 236, 220, 0.84);
        text-shadow: 0 5px 16px rgba(0, 0, 0, 0.74);
      }

      .brand-seal {
        display: grid;
        place-items: center;
        width: 2.2rem;
        height: 2.2rem;
        color: var(--gold);
        font-family: "Yu Mincho", "Songti SC", serif;
        font-size: 1.2rem;
        background:
          linear-gradient(135deg, rgba(212, 176, 110, 0.24), transparent),
          rgba(8, 6, 5, 0.28);
        clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%);
      }

      .brand-text strong {
        display: block;
        font-weight: 500;
      }

      .brand-text span {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .left-rail {
        position: absolute;
        top: 7.6rem;
        left: 2.25rem;
        z-index: 8;
        width: 10.8rem;
      }

      .day-plaque {
        position: relative;
        margin-bottom: 1.4rem;
        padding: 0.9rem 1rem 1.1rem;
        background: linear-gradient(180deg, rgba(21, 24, 43, 0.72), rgba(16, 16, 28, 0.52));
        color: #fff3e1;
        text-align: center;
        clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
        backdrop-filter: blur(10px);
      }

      .day-plaque b {
        display: block;
        font-family: "Yu Mincho", "Songti SC", serif;
        font-size: 2.4rem;
        font-weight: 500;
        line-height: 1;
      }

      .day-plaque span {
        display: block;
        margin-top: 0.3rem;
        color: rgba(247, 236, 220, 0.68);
        font-size: 0.78rem;
      }

      .status-slip {
        display: grid;
        grid-template-columns: 2rem 1fr;
        align-items: center;
        min-height: 2.45rem;
        margin-bottom: 0.7rem;
        background: linear-gradient(90deg, rgba(17, 19, 32, 0.72), rgba(17, 19, 32, 0.34));
        color: rgba(247, 236, 220, 0.86);
        box-shadow: inset 0 0 0 1px rgba(247, 236, 220, 0.16);
        backdrop-filter: blur(8px);
      }

      .status-slip svg {
        width: 1.1rem;
        height: 1.1rem;
        margin: auto;
        opacity: 0.86;
      }

      .status-slip strong {
        padding-right: 0.6rem;
        text-align: right;
        font-size: 0.95rem;
        font-weight: 500;
      }

      .top-center {
        position: absolute;
        top: 1.8rem;
        left: 50%;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        color: rgba(247, 236, 220, 0.86);
        transform: translateX(-50%);
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      }

      .gem {
        width: 0.7rem;
        height: 0.7rem;
        background: linear-gradient(135deg, #fff2df, #d89a8f);
        transform: rotate(45deg);
      }

      .top-icons {
        position: absolute;
        top: 1.8rem;
        right: 2rem;
        z-index: 9;
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .icon-button {
        width: 2.2rem;
        height: 2.2rem;
        display: grid;
        place-items: center;
        background: transparent;
        color: rgba(247, 236, 220, 0.74);
        opacity: 0.9;
      }

      .icon-button:hover {
        color: #fff7e8;
      }

      .icon-button svg {
        width: 1.45rem;
        height: 1.45rem;
      }

      .sprite-spot {
        position: absolute;
        left: 43%;
        right: 26%;
        bottom: 7%;
        z-index: 5;
        display: flex;
        justify-content: center;
        align-items: end;
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .mode-menu .sprite-spot {
        opacity: 0;
        transform: translateY(1.1rem);
      }

      .sprite-spot img {
        width: min(22rem, 100%);
        height: auto;
        filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.55));
      }

      .right-actions {
        position: absolute;
        top: 30%;
        right: 3.2rem;
        z-index: 9;
        display: grid;
        gap: 0.85rem;
        width: 12rem;
      }

      .action-pill {
        display: grid;
        grid-template-columns: 1fr 2.7rem;
        align-items: center;
        min-height: 2.85rem;
        padding-left: 1.2rem;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(8, 6, 5, 0.7), rgba(8, 6, 5, 0.34));
        color: rgba(247, 236, 220, 0.78);
        text-align: left;
        backdrop-filter: blur(8px);
      }

      .action-pill:hover {
        color: #fff7e8;
        background: linear-gradient(90deg, rgba(81, 51, 34, 0.76), rgba(8, 6, 5, 0.38));
      }

      .mode-menu .right-actions {
        opacity: 0;
        pointer-events: none;
      }

      .mode-menu .dialogue {
        opacity: 0;
        transform: translateY(1.1rem);
        pointer-events: none;
      }

      .mode-menu .left-rail {
        opacity: 0.16;
      }

      .action-pill svg {
        width: 1.6rem;
        height: 1.6rem;
        opacity: 0.72;
      }

      .dialogue {
        position: absolute;
        left: 4.5%;
        right: 4.5%;
        bottom: 3.7%;
        z-index: 10;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .nameplate {
        display: inline-flex;
        align-items: center;
        min-width: 9rem;
        min-height: 2.25rem;
        padding: 0 1.2rem;
        margin-left: 1.2rem;
        background: linear-gradient(90deg, rgba(35, 37, 56, 0.82), rgba(35, 37, 56, 0.46));
        color: #fff3e2;
        font-family: "Yu Mincho", "Songti SC", serif;
        clip-path: polygon(0 0, calc(100% - 1.3rem) 0, 100% 50%, calc(100% - 1.3rem) 100%, 0 100%);
        backdrop-filter: blur(8px);
      }

      .dialogue-strip {
        min-height: 5.9rem;
        padding: 1rem 1.35rem 1.05rem;
        background: linear-gradient(180deg, rgba(8, 6, 5, 0.58), rgba(8, 6, 5, 0.38));
        color: rgba(247, 236, 220, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(247, 236, 220, 0.24),
          inset 0 -1px 0 rgba(247, 236, 220, 0.18);
        backdrop-filter: blur(12px);
      }

      .dialogue-text {
        margin: 0;
        max-width: 65rem;
        font-size: 1rem;
        line-height: 1.85;
      }

      .menu-layer {
        position: absolute;
        inset: 0;
        z-index: 22;
        display: none;
        padding: 5.4rem 4.6rem 4.2rem;
      }

      .mode-menu .menu-layer {
        display: grid;
        grid-template-columns: 11rem minmax(0, 1fr);
        gap: 2.2rem;
      }

      .menu-tabs {
        align-self: center;
        display: grid;
        gap: 0.82rem;
      }

      .menu-tab {
        position: relative;
        min-height: 2.15rem;
        padding: 0 0 0 1rem;
        background: transparent;
        color: rgba(247, 236, 220, 0.62);
        text-align: left;
      }

      .menu-tab::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.4rem;
        bottom: 0.4rem;
        width: 3px;
        background: var(--tea);
        opacity: 0.35;
      }

      .menu-tab::after {
        content: "";
        position: absolute;
        left: 4.8rem;
        right: 0;
        top: 50%;
        border-top: 1px dotted rgba(247, 236, 220, 0.22);
      }

      .menu-tab:hover,
      .menu-tab.is-active {
        color: #fff7e8;
      }

      .menu-tab.is-active::before {
        opacity: 1;
      }

      .menu-main {
        min-width: 0;
        align-self: stretch;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 0.2rem 0 0;
        background: linear-gradient(90deg, rgba(7, 5, 4, 0.28), rgba(7, 5, 4, 0.08));
        backdrop-filter: blur(12px);
      }

      .menu-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 0 0.85rem;
        border-bottom: 1px solid rgba(247, 236, 220, 0.22);
      }

      .menu-head h2 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 500;
      }

      .menu-head p {
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .close-button,
      .small-button,
      .choice-button {
        min-height: 2rem;
        padding: 0 0.78rem;
        border: 1px solid rgba(247, 236, 220, 0.18);
        border-radius: 999px;
        background: rgba(7, 5, 4, 0.28);
        color: rgba(247, 236, 220, 0.72);
        backdrop-filter: blur(8px);
      }

      .close-button:hover,
      .small-button:hover,
      .choice-button:hover {
        border-color: var(--line-strong);
        color: #fff7e8;
      }

      .menu-content {
        min-height: 0;
        overflow: auto;
        padding: 0.9rem 0.3rem 0.2rem 0;
      }

      .menu-content::-webkit-scrollbar {
        width: 0.36rem;
      }

      .menu-content::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(247, 236, 220, 0.2);
      }

      .data-grid {
        display: grid;
        gap: 0.82rem;
      }

      .data-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .data-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .data-line,
      .metric-line,
      .schedule-panel {
        position: relative;
        padding: 0.72rem 0.2rem 0.78rem 0.85rem;
        border-top: 1px dotted rgba(247, 236, 220, 0.24);
      }

      .data-line::before,
      .metric-line::before,
      .schedule-panel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.9rem;
        bottom: 0.9rem;
        width: 3px;
        background: var(--gold);
        opacity: 0.62;
      }

      .metric-line span,
      .data-line span {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .metric-line strong {
        display: block;
        margin-top: 0.22rem;
        color: #fff3e0;
        font-size: 1.42rem;
        font-weight: 500;
      }

      .data-line h3,
      .schedule-panel h3 {
        margin: 0;
        color: #fff3e0;
        font-size: 1rem;
        font-weight: 500;
      }

      .data-line p,
      .metric-line p,
      .hint {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.58;
      }

      .line-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 0.8rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 1.35rem;
        padding: 0 0.48rem;
        border-radius: 999px;
        background: rgba(247, 236, 220, 0.08);
        color: rgba(247, 236, 220, 0.75);
        font-size: 0.72rem;
      }

      .tag.good {
        color: #dff5ea;
        background: rgba(128, 170, 156, 0.22);
      }

      .tag.warn {
        color: #ffe2bf;
        background: rgba(183, 121, 85, 0.24);
      }

      .thin-meter {
        height: 0.34rem;
        margin-top: 0.58rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(247, 236, 220, 0.1);
      }

      .thin-meter span {
        display: block;
        width: var(--value);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--tea), var(--gold));
      }

      .row-actions,
      .option-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.62rem;
      }

      .schedule {
        display: grid;
        gap: 0.32rem;
      }

      .shift-row {
        display: grid;
        grid-template-columns: 5rem repeat(4, minmax(0, 1fr));
        gap: 0.32rem;
      }

      .shift-name,
      .shift-cell,
      .option-button {
        min-height: 2.7rem;
        background: rgba(7, 5, 4, 0.18);
        color: rgba(247, 236, 220, 0.74);
        box-shadow: inset 0 -1px 0 rgba(247, 236, 220, 0.16);
      }

      .shift-name {
        display: grid;
        place-items: center;
        font-size: 0.78rem;
      }

      .shift-cell {
        padding: 0.34rem;
      }

      .shift-cell.is-work {
        background: rgba(128, 170, 156, 0.14);
      }

      .shift-cell.is-selected {
        color: #fff4df;
        box-shadow:
          inset 0 -1px 0 rgba(247, 236, 220, 0.3),
          inset 0 0 0 1px rgba(212, 179, 109, 0.54);
      }

      .shift-cell strong {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
      }

      .shift-cell span {
        display: block;
        margin-top: 0.12rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .option-button {
        min-height: 1.9rem;
        padding: 0 0.7rem;
        border-radius: 999px;
      }

      .option-button.is-active,
      .option-button:hover {
        color: #fff7e8;
        background: rgba(89, 57, 36, 0.55);
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 15%;
        z-index: 40;
        padding: 0.55rem 1rem;
        border-radius: 999px;
        background: rgba(7, 5, 4, 0.72);
        color: rgba(247, 236, 220, 0.9);
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
        pointer-events: none;
        backdrop-filter: blur(10px);
      }

      .toast.is-show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 760px) {
        .play-screen {
          aspect-ratio: 9 / 16;
        }

        .corner-brand {
          top: 1rem;
          left: 1rem;
        }

        .left-rail {
          top: 5.2rem;
          left: 1rem;
          width: 8.2rem;
        }

        .day-plaque b {
          font-size: 1.7rem;
        }

        .status-slip {
          min-height: 2rem;
          font-size: 0.76rem;
        }

        .top-center {
          top: 1rem;
          left: auto;
          right: 4.2rem;
          transform: none;
          font-size: 0.72rem;
        }

        .top-icons {
          top: 0.75rem;
          right: 0.8rem;
          gap: 0.4rem;
        }

        .sprite-spot {
          left: 30%;
          right: -8%;
          bottom: 16%;
        }

        .sprite-spot img {
          width: min(18rem, 120%);
        }

        .right-actions {
          top: 31%;
          right: 1rem;
          width: 8.2rem;
          gap: 0.48rem;
        }

        .action-pill {
          grid-template-columns: 1fr 2rem;
          min-height: 2.2rem;
          padding-left: 0.75rem;
          font-size: 0.78rem;
        }

        .dialogue {
          left: 3%;
          right: 3%;
          bottom: 2.6%;
        }

        .nameplate {
          min-height: 1.9rem;
          font-size: 0.9rem;
        }

        .dialogue-strip {
          min-height: 7rem;
          padding: 0.78rem 0.86rem;
        }

        .dialogue-text {
          font-size: 0.82rem;
          line-height: 1.68;
        }

        .menu-layer {
          padding: 4.5rem 0.9rem 1rem;
        }

        .mode-menu .menu-layer {
          grid-template-columns: 1fr;
          gap: 0.6rem;
        }

        .menu-tabs {
          display: flex;
          align-self: start;
          gap: 0.45rem;
          overflow-x: auto;
        }

        .menu-tab {
          min-width: 4.8rem;
          padding-left: 0.7rem;
          white-space: nowrap;
          font-size: 0.78rem;
        }

        .menu-tab::after {
          display: none;
        }

        .menu-head h2 {
          font-size: 1rem;
        }

        .menu-head p,
        .data-line p,
        .metric-line p {
          font-size: 0.72rem;
        }

        .data-grid.two,
        .data-grid.three {
          grid-template-columns: 1fr;
        }

        .shift-row {
          grid-template-columns: 3.7rem repeat(4, minmax(4.1rem, 1fr));
          min-width: 22rem;
        }

        .schedule {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="play-screen mode-scene" id="game" aria-label="Xem trước chế độ chủ tiệm">
      <img class="scene-bg" src="https://i.postimg.cc/76GcBn1V/boss-lobby-night.png" alt="" />
      <div class="shade"></div>
      <div class="steam"></div>
      <svg class="hud-lines" viewBox="0 0 1366 768" preserveAspectRatio="none" aria-hidden="true">
        <path d="M36 42h170M36 714h300M1020 90h260M1180 692h126" stroke="rgba(247,236,220,.24)" />
        <path d="M180 90v580M1194 138v500" stroke="rgba(247,236,220,.12)" stroke-dasharray="4 8" />
      </svg>

      <header class="corner-brand">
        <span class="brand-seal">汤</span>
        <span class="brand-text"><strong>Hoa Chưa Nở</strong><span>Góc nhìn chủ tiệm</span></span>
      </header>

      <aside class="left-rail" aria-label="Trạng thái kinh doanh">
        <div class="day-plaque"><b>58</b><span>Ngày kinh doanh</span></div>
        <div class="status-slip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 4 8v8l8 4 8-4V8Z" fill="none" stroke="currentColor" stroke-width="1.8" /></svg>
          <strong id="fundsText">¥42,800</strong>
        </div>
        <div class="status-slip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.8" /></svg>
          <strong id="placeText">Phòng nghỉ</strong>
        </div>
        <div class="status-slip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12v10H6zM8 5h8" fill="none" stroke="currentColor" stroke-width="1.8" /></svg>
          <strong>36 khách</strong>
        </div>
      </aside>

      <div class="top-center">
        <span id="timeText">14:20</span>
        <span class="gem"></span><span class="gem"></span><span class="gem"></span><span class="gem"></span>
        <span>4.6</span>
      </div>

      <nav class="top-icons" aria-label="Thao tác đầu trang">
        <button class="icon-button" type="button" data-title-screen aria-label="Về màn hình tiêu đề">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" /></svg>
        </button>
        <button class="icon-button" type="button" data-toggle-menu aria-label="Mở menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" /></svg>
        </button>
      </nav>

      <section class="sprite-spot" aria-hidden="true">
        <img src="https://i.postimg.cc/NfgYpZVt/114.png" alt="" />
      </section>

      <nav class="right-actions" aria-label="Thao tác cảnh">
        <button class="action-pill" type="button" data-menu-tab="overview">Tổng quan<svg viewBox="0 0 24 24"><path d="M4 13h6V5H4zm10 6h6V5h-6zM4 19h6v-4H4z" fill="currentColor" /></svg></button>
        <button class="action-pill" type="button" data-menu-tab="schedule">Xếp ca<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></button>
        <button class="action-pill" type="button" data-menu-tab="employees">Nhân viên<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm7 8a7 7 0 0 0-14 0" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></button>
        <button class="action-pill" type="button" data-menu-tab="recruit">Tuyển dụng<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" /></svg></button>
        <button class="action-pill" type="button" data-close-day>Kết toán<svg viewBox="0 0 24 24"><path d="M7 4h10v16H7zM9 8h6M9 12h6M9 16h3" fill="none" stroke="currentColor" stroke-width="1.8" /></svg></button>
      </nav>

      <section class="dialogue" aria-label="Hội thoại">
        <div class="nameplate" id="speakerName">Yuri</div>
        <div class="dialogue-strip">
          <p class="dialogue-text" id="dialogueText">"Thưa ông chủ, bên phòng nghỉ đã sắp xếp xong. Ông muốn xem tình hình kinh doanh hôm nay trước, hay ra hiện trường xem thử?"</p>
        </div>
      </section>

      <section class="menu-layer" aria-label="Menu kinh doanh">
        <nav class="menu-tabs" id="menuTabs" aria-label="Danh mục menu"></nav>
        <section class="menu-main">
          <header class="menu-head">
            <div>
              <h2 id="menuTitle">Tổng quan</h2>
              <p id="menuNote">Thông tin kinh doanh quan trọng nhất hôm nay.</p>
            </div>
            <button class="close-button" type="button" data-close-menu>Quay lại</button>
          </header>
          <div class="menu-content" id="menuContent"></div>
        </section>
      </section>

      <div class="toast" id="toast"></div>
    </main>

    <script>
      const game = document.querySelector("#game");
      const menuTabs = document.querySelector("#menuTabs");
      const menuTitle = document.querySelector("#menuTitle");
      const menuNote = document.querySelector("#menuNote");
      const menuContent = document.querySelector("#menuContent");
      const timeText = document.querySelector("#timeText");
      const placeText = document.querySelector("#placeText");
      const fundsText = document.querySelector("#fundsText");
      const speakerName = document.querySelector("#speakerName");
      const dialogueText = document.querySelector("#dialogueText");
      const toast = document.querySelector("#toast");

      const yuan = (value) => `¥${Number(value).toLocaleString("vi-VN")}`;
      const percent = (value) => `${Math.round(value)}%`;

      const state = {
        view: "overview",
        time: "14:20",
        place: "Phòng nghỉ",
        funds: 42800,
        traffic: 36,
        score: 4.6,
        praise: 92,
        activeShift: null,
        scheduleParts: ["Ca sáng", "Ca trưa", "Ca tối", "Ca đêm"],
        employees: [
          { name: "Yuri", grade: "Hạng A", area: "Phòng nghỉ", status: "Đang được chỉ định", dailySalary: 800, score: 92, serviceCount: 16, nominationCount: 7, extraCount: 3, schedule: ["Tiền sảnh", "Phòng nghỉ", "Phòng nghỉ", "Nghỉ"] },
          { name: "Mio", grade: "Hạng B", area: "Phòng trị liệu", status: "Đang phục vụ", dailySalary: 620, score: 81, serviceCount: 11, nominationCount: 3, extraCount: 1, schedule: ["Phòng trị liệu", "Phòng trị liệu", "Nghỉ", "Dọn dẹp"] },
          { name: "Chinatsu", grade: "Hạng S", area: "Phòng riêng", status: "Đang được chỉ định", dailySalary: 1200, score: 96, serviceCount: 24, nominationCount: 12, extraCount: 6, schedule: ["Nghỉ", "Phòng riêng", "Phòng riêng", "Chờ lệnh"] },
          { name: "Rin", grade: "Người mới", area: "Tiền sảnh", status: "Chờ lệnh", dailySalary: 420, score: 58, serviceCount: 4, nominationCount: 0, extraCount: 0, schedule: ["Tiền sảnh", "Tiền sảnh", "Nghỉ", "Nghỉ"] },
        ],
        areas: [
          { name: "Tiền sảnh", guests: 5, note: "Khách mới tư vấn và làm thủ tục nhận phòng.", staff: ["Rin"] },
          { name: "Bể tắm công cộng", guests: 12, note: "Khách thường nhiều nhất, ảnh hưởng đến đánh giá cơ bản.", staff: [] },
          { name: "Phòng trị liệu", guests: 4, note: "Xoa bóp trị liệu đang diễn ra.", staff: ["Mio"] },
          { name: "Phòng nghỉ", guests: 8, note: "Khách quen và khách chỉ định chờ khá nhiều.", staff: ["Yuri"] },
          { name: "Phòng riêng", guests: 3, note: "Khu vực tập trung khách chi tiêu cao.", staff: ["Chinatsu"] },
        ],
        projects: [
          { name: "Xoa bóp trị liệu", score: 4.8, recommend: 92, price: 1200, demand: "Nổi bật" },
          { name: "Ngâm tắm nghỉ ngơi", score: 4.5, recommend: 76, price: 680, demand: "Ổn định" },
          { name: "Đồng hành khu nghỉ ngơi", score: 4.7, recommend: 84, price: 900, demand: "Nhiều khách quen" },
          { name: "Dịch vụ phòng riêng", score: 4.2, recommend: 61, price: 2200, demand: "Cần điều chỉnh" },
        ],
        nominations: [
          { employee: "Yuri", guest: "Khách quen số 1", area: "Phòng nghỉ", remaining: 2, bill: 1200 },
          { employee: "Chinatsu", guest: "Khách quen số 2", area: "Phòng riêng", remaining: 1, bill: 1800 },
        ],
        market: [
          { name: "Sayo", style: "Dịu dàng", note: "Có kinh nghiệm làm việc ở tiệm khác, phù hợp đồng hành khu nghỉ ngơi.", ask: 18000, daily: 780 },
          { name: "Saori", style: "Chín chắn", note: "Giỏi xoa bóp trị liệu, khả năng duy trì khách quen tốt.", ask: 24000, daily: 960 },
        ],
        recruit: { name: "Sayo", refresh: "11:42:18", count: 1, ask: 780, note: "Chuyển từ tiệm khác đến, muốn tìm một môi trường ổn định hơn." },
        settlement: { income: 18600, expense: 6840, gross: 11760 },
        logs: ["Xoa bóp trị liệu hôm nay đánh giá khá cao, có thể cân nhắc tăng giá buổi tối.", "Hai khách ở phòng nghỉ đang chờ khoảng trống chỉ định."],
      };

      const tabs = {
        overview: ["Tổng quan", "Thông tin kinh doanh quan trọng nhất hôm nay."],
        schedule: ["Xếp ca", "Bấm khung giờ tương ứng của nhân viên rồi chọn vị trí hoặc nghỉ ngơi."],
        areas: ["Khu vực", "Xem lượng khách và nhân viên đang làm ở từng khu vực."],
        employees: ["Nhân viên", "Nhân viên cùng khu vực có thể trò chuyện, tăng lương ngày hoặc xem dịch vụ."],
        projects: ["Dự án", "Giá trị đề xuất của dự án ảnh hưởng đến lượng khách và điều chỉnh giá sau này."],
        nominations: ["Chỉ định", "Chỉ định xuyên ngày tiếp diễn theo số ngày còn lại."],
        market: ["Chợ nhân tài", "Xem nhân tài có thể mua vào."],
        recruit: ["Tuyển dụng", "Ứng viên mặc định làm mới mỗi 12 giờ."],
        settlement: ["Kết toán", "Kết toán kinh doanh hôm nay và tiến đến 00:00."],
      };

      function tag(text, tone = "") {
        return `<span class="tag ${tone}">${text}</span>`;
      }

      function meter(value) {
        return `<div class="thin-meter" style="--value:${Math.max(0, Math.min(100, value))}%"><span></span></div>`;
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("is-show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("is-show"), 1500);
      }

      function setLine(name, text) {
        speakerName.textContent = name;
        dialogueText.textContent = text;
      }

      function syncHud() {
        timeText.textContent = state.time;
        placeText.textContent = state.place;
        fundsText.textContent = yuan(state.funds);
      }

      function currentStaff() {
        return state.employees.filter((employee) => employee.area === state.place);
      }

      function scheduleChoices() {
        return ["Nghỉ", "Chờ lệnh", ...state.areas.map((area) => area.name), "Dọn dẹp"];
      }

      function renderTabs() {
        menuTabs.innerHTML = Object.entries(tabs)
          .map(([key, item]) => `<button class="menu-tab ${state.view === key ? "is-active" : ""}" type="button" data-menu-tab="${key}">${item[0]}</button>`)
          .join("");
      }

      function renderMenu() {
        const [title, note] = tabs[state.view];
        menuTitle.textContent = title;
        menuNote.textContent = note;
        renderTabs();
        menuContent.innerHTML =
          {
            overview: renderOverview,
            schedule: renderSchedule,
            areas: renderAreas,
            employees: renderEmployees,
            projects: renderProjects,
            nominations: renderNominations,
            market: renderMarket,
            recruit: renderRecruit,
            settlement: renderSettlement,
          }[state.view]?.() || "";
      }

      function renderOverview() {
        const payroll = state.employees.reduce((sum, item) => sum + item.dailySalary, 0);
        const hotProject = [...state.projects].sort((a, b) => b.recommend - a.recommend)[0];
        const staffHere = currentStaff().map((item) => item.name).join("、") || "Chưa có";
        return `
          <div class="data-grid three">
            <section class="metric-line"><span>Lượng khách hôm nay</span><strong>${state.traffic}</strong><p>Gồm khách thường, khách quen và đặt lịch.</p></section>
            <section class="metric-line"><span>Đánh giá cửa hàng</span><strong>${state.score}</strong><p>Tỷ lệ đánh giá tốt ${percent(state.praise)}, sẽ ảnh hưởng đến lượng khách ngày mai.</p></section>
            <section class="metric-line"><span>Chỉ định đang chiếm dụng</span><strong>${state.nominations.length}</strong><p>Chỉ định xuyên ngày sẽ tiếp tục chiếm dụng nhân viên tương ứng.</p></section>
          </div>
          <div class="data-grid two" style="margin-top:.8rem;">
            <section class="data-line">
              <div class="line-head"><h3>${hotProject.name}</h3>${tag(hotProject.demand, "good")}</div>
              <p>Đánh giá ${hotProject.score} · Giá trị đề xuất ${percent(hotProject.recommend)}</p>${meter(hotProject.recommend)}
            </section>
            <section class="metric-line"><span>Lợi nhuận gộp hôm nay</span><strong>${yuan(state.settlement.gross)}</strong><p>Thu nhập ${yuan(state.settlement.income)}, chi tiêu ${yuan(state.settlement.expense)}, tổng lương ngày ${yuan(payroll)}.</p></section>
          </div>
          <div class="data-grid two" style="margin-top:.8rem;">
            <section class="metric-line"><span>Vị trí hiện tại</span><strong>${state.place}</strong><p>Nhân viên cùng khu vực: ${staffHere}.</p></section>
            <section class="metric-line"><span>Làm mới tuyển dụng</span><strong>${state.recruit.refresh}</strong><p>Ứng viên hiện tại: ${state.recruit.name}, số lần từ chối ${state.recruit.count}.</p></section>
          </div>
          <div class="data-grid" style="margin-top:.8rem;">${state.logs.map((log) => `<section class="data-line"><h3>${log}</h3><p>Nhắc nhở kinh doanh sẽ hiển thị tập trung ở đây.</p></section>`).join("")}</div>
        `;
      }

      function renderSchedule() {
        const rows = state.employees
          .map((employee) => {
            const cells = employee.schedule
              .map((slot, index) => {
                const selected = state.activeShift?.name === employee.name && state.activeShift?.index === index;
                const tone = slot === "Nghỉ" ? "is-rest" : "is-work";
                return `<button class="shift-cell ${tone} ${selected ? "is-selected" : ""}" type="button" data-shift="${employee.name}|${index}">
                  <strong>${slot}</strong><span>${state.scheduleParts[index]}</span>
                </button>`;
              })
              .join("");
            return `<div class="shift-row"><div class="shift-name">${employee.name}</div>${cells}</div>`;
          })
          .join("");
        const active = state.activeShift;
        const currentValue = active ? state.employees.find((item) => item.name === active.name).schedule[active.index] : "";
        const optionPanel = active
          ? `<section class="schedule-panel"><h3>${active.name} · ${state.scheduleParts[active.index]}</h3><p class="hint">Chọn vị trí hoặc trạng thái cho khung giờ này.</p><div class="option-grid">${scheduleChoices().map((choice) => `<button class="option-button ${currentValue === choice ? "is-active" : ""}" type="button" data-shift-option="${choice}">${choice}</button>`).join("")}</div></section>`
          : `<section class="schedule-panel"><h3>Chọn ô thời gian</h3><p class="hint">Sau khi bấm khung giờ tương ứng của nhân viên, chọn nghỉ ngơi, chờ lệnh hoặc khu vực cụ thể ở đây.</p></section>`;
        return `
          <div class="schedule">
            <div class="shift-row"><div class="shift-name">Nhân viên</div>${state.scheduleParts.map((part) => `<div class="shift-name">${part}</div>`).join("")}</div>
            ${rows}
          </div>
          ${optionPanel}
          <div class="row-actions"><button class="small-button" type="button" data-confirm-schedule>Xác nhận xếp ca</button></div>
        `;
      }

      function renderAreas() {
        return `<div class="data-grid two">
          ${state.areas
            .map(
              (area) => `
                <section class="data-line">
                  <div class="line-head"><h3>${area.name}</h3>${tag(`${area.guests} người`, area.name === state.place ? "warn" : "")}</div>
                  <p>${area.note}</p><p>Đang làm: ${area.staff.join("、") || "Chưa có"}</p>
                  <div class="row-actions"><button class="small-button" type="button" data-go-area="${area.name}">${area.name === state.place ? "Đang ở đây" : "Đến đây"}</button></div>
                </section>
              `,
            )
            .join("")}
        </div>`;
      }

      function renderEmployees() {
        return `<div class="data-grid two">
          ${state.employees
            .map((employee) => {
              const sameArea = employee.area === state.place;
              const actions = sameArea
                ? `<button class="small-button" type="button" data-talk="${employee.name}">Trò chuyện</button>
                   <button class="small-button" type="button" data-raise="${employee.name}">Tăng lương ngày</button>
                   <button class="small-button" type="button" data-check-service="${employee.name}">Xem dịch vụ</button>`
                : `<button class="small-button" type="button" data-go-employee="${employee.name}">Đến đây</button>`;
              return `<section class="data-line">
                <div class="line-head"><h3>${employee.name}</h3><span>${tag(employee.grade)} ${tag(employee.status, employee.status === "Đang được chỉ định" ? "warn" : "")}</span></div>
                <p>${employee.area} · Lương ngày ${yuan(employee.dailySalary)} · Đánh giá ${employee.score}</p>${meter(employee.score)}
                <p>Phục vụ ${employee.serviceCount} · Chỉ định ${employee.nominationCount} · Kết quả thêm ${employee.extraCount}</p>
                <div class="row-actions">${actions}</div>
              </section>`;
            })
            .join("")}
        </div>`;
      }

      function renderProjects() {
        return `<div class="data-grid two">
          ${state.projects
            .map(
              (project) => `<section class="data-line">
                <div class="line-head"><h3>${project.name}</h3>${tag(project.demand, project.recommend >= 86 ? "good" : "")}</div>
                <p>Giá cơ bản ${yuan(project.price)} · Đánh giá ${project.score}</p>${meter(project.recommend)}
                <p>Giá trị đề xuất ${percent(project.recommend)}, sẽ ảnh hưởng đến lượng khách của dự án này sau này.</p>
                <div class="row-actions"><button class="small-button" type="button" data-project-edit="${project.name}">Điều chỉnh</button></div>
              </section>`,
            )
            .join("")}
          <section class="data-line"><h3>Dự án tùy chỉnh</h3><p>Sau này có thể thêm dự án dịch vụ và giá cả mới ở đây.</p><div class="row-actions"><button class="small-button" type="button" data-project-edit="Dự án tùy chỉnh">Thêm mới</button></div></section>
        </div>`;
      }

      function renderNominations() {
        return `<div class="data-grid two">
          ${state.nominations
            .map(
              (item) => `<section class="data-line">
                <div class="line-head"><h3>${item.employee}</h3>${tag(`Còn lại ${item.remaining} ngày`, "warn")}</div>
                <p>${item.guest} · ${item.area}</p><p>Thu nhập chỉ định dự kiến ${yuan(item.bill)}, xử lý theo số ngày còn lại khi kết toán.</p>
                <div class="row-actions"><button class="small-button" type="button" data-check-service="${item.employee}">Xem dịch vụ</button></div>
              </section>`,
            )
            .join("")}
        </div>`;
      }

      function renderMarket() {
        return `<div class="data-grid two">
          ${state.market
            .map(
              (item) => `<section class="data-line">
                <div class="line-head"><h3>${item.name}</h3>${tag(item.style)}</div>
                <p>${item.note}</p><p>Giá thị trường ${yuan(item.ask)} · Lương ngày kỳ vọng ${yuan(item.daily)}</p>
                <div class="row-actions"><button class="small-button" type="button" data-market-talk="${item.name}">Giao lưu</button><button class="small-button" type="button" data-buy="${item.name}">Mua vào</button></div>
              </section>`,
            )
            .join("")}
        </div>`;
      }

      function renderRecruit() {
        const item = state.recruit;
        return `
          <div class="data-grid two">
            <section class="metric-line"><span>Đếm ngược làm mới</span><strong>${item.refresh}</strong><p>Mặc định làm mới một ứng viên mỗi 12 giờ.</p></section>
            <section class="metric-line"><span>Ứng viên hiện tại</span><strong>${item.name}</strong><p>Số lần từ chối ${item.count}, lần xuất hiện sau sẽ đổi phần tự giới thiệu mới.</p></section>
          </div>
          <section class="data-line" style="margin-top:.8rem;">
            <div class="line-head"><h3>${item.name}</h3>${tag(`Lương ngày kỳ vọng ${yuan(item.ask)}`)}</div>
            <p>${item.note}</p>
            <div class="row-actions"><button class="small-button" type="button" data-recruit-talk="${item.name}">Phỏng vấn</button><button class="small-button" type="button" data-hire>Tuyển dụng</button><button class="small-button" type="button" data-reject>Từ chối</button></div>
          </section>
        `;
      }

      function renderSettlement() {
        return `
          <div class="data-grid three">
            <section class="metric-line"><span>Thu nhập</span><strong>${yuan(state.settlement.income)}</strong><p>Dự án, lưu trú và chỉ định.</p></section>
            <section class="metric-line"><span>Chi tiêu</span><strong>${yuan(state.settlement.expense)}</strong><p>Lương ngày, vật tư tiêu hao và bảo trì.</p></section>
            <section class="metric-line"><span>Lợi nhuận gộp</span><strong>${yuan(state.settlement.gross)}</strong><p>Đồng bộ vốn sau khi kết toán.</p></section>
          </div>
          <section class="data-line" style="margin-top:.8rem;">
            <div class="line-head"><h3>Kết toán hôm nay</h3><button class="small-button" type="button" data-close-day>Thực hiện</button></div>
            <p>Sau khi thực hiện thời gian tiến đến 00:00, nội dung hôm nay được làm mới, chỉ định xuyên ngày giảm số ngày còn lại.</p>
          </section>
        `;
      }

      function openMenu(view = state.view) {
        state.view = view;
        game.classList.remove("mode-scene");
        game.classList.add("mode-menu");
        renderMenu();
      }

      function closeMenu() {
        game.classList.remove("mode-menu");
        game.classList.add("mode-scene");
      }

      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-title-screen]")) {
          window.location.href = "./frontend-mode-select.html";
          return;
        }

        if (event.target.closest("[data-toggle-menu]")) {
          openMenu();
          return;
        }

        if (event.target.closest("[data-close-menu]")) {
          closeMenu();
          return;
        }

        const tab = event.target.closest("[data-menu-tab]");
        if (tab) {
          openMenu(tab.dataset.menuTab);
          return;
        }

        const shift = event.target.closest("[data-shift]");
        if (shift) {
          const [name, indexText] = shift.dataset.shift.split("|");
          state.activeShift = { name, index: Number(indexText) };
          renderMenu();
          return;
        }

        const shiftOption = event.target.closest("[data-shift-option]");
        if (shiftOption && state.activeShift) {
          const employee = state.employees.find((item) => item.name === state.activeShift.name);
          employee.schedule[state.activeShift.index] = shiftOption.dataset.shiftOption;
          renderMenu();
          return;
        }

        if (event.target.closest("[data-confirm-schedule]")) {
          showToast("Xếp ca đã được xác nhận.");
          setLine("Yuri", "\"Xếp ca đã được xác nhận, tôi sẽ chuẩn bị theo sắp xếp mới.\"");
          return;
        }

        const areaButton = event.target.closest("[data-go-area]");
        if (areaButton) {
          state.place = areaButton.dataset.goArea;
          syncHud();
          setLine(currentStaff()[0]?.name || "Nhân viên", `"Đây là ${state.place}, lượng khách hiện tại đã được cập nhật trong menu."`);
          renderMenu();
          return;
        }

        const goEmployee = event.target.closest("[data-go-employee]");
        if (goEmployee) {
          const employee = state.employees.find((item) => item.name === goEmployee.dataset.goEmployee);
          state.place = employee.area;
          syncHud();
          setLine(employee.name, `"Thưa ông chủ, ông đã đến rồi. Bây giờ đây là ${employee.area}."`);
          renderMenu();
          return;
        }

        const talk = event.target.closest("[data-talk]");
        if (talk) {
          setLine(talk.dataset.talk, "\"Bây giờ tôi tiện nói chuyện, ông muốn hỏi về khách hôm nay, hay hỏi về xếp ca trước?\"");
          closeMenu();
          return;
        }

        const raise = event.target.closest("[data-raise]");
        if (raise) {
          const employee = state.employees.find((item) => item.name === raise.dataset.raise);
          employee.dailySalary += 100;
          showToast(`${employee.name} đã tăng lương ngày lên ${yuan(employee.dailySalary)}.`);
          renderMenu();
          return;
        }

        const check = event.target.closest("[data-check-service]");
        if (check) {
          const employee = state.employees.find((item) => item.name === check.dataset.checkService);
          state.place = employee.area;
          syncHud();
          setLine(employee.name, "\"Tôi sẽ tiếp tục trông coi ở đây. Nếu ông muốn tự mình quan sát, có thể bắt đầu từ đây.\"");
          closeMenu();
          return;
        }

        const projectEdit = event.target.closest("[data-project-edit]");
        if (projectEdit) {
          showToast(`Thiết lập giá và độ hot của ${projectEdit.dataset.projectEdit} sẽ được tích hợp sau.`);
          return;
        }

        const marketTalk = event.target.closest("[data-market-talk]");
        if (marketTalk) {
          showToast(`Đã sắp xếp giao lưu với ${marketTalk.dataset.marketTalk}.`);
          return;
        }

        const buy = event.target.closest("[data-buy]");
        if (buy) {
          const item = state.market.find((candidate) => candidate.name === buy.dataset.buy);
          if (state.funds < item.ask) {
            showToast("Không đủ tiền.");
            return;
          }
          state.funds -= item.ask;
          state.employees.push({ name: item.name, grade: "Chưa xác định", area: "Tiền sảnh", status: "Chờ lệnh", dailySalary: item.daily, score: 60, serviceCount: 0, nominationCount: 0, extraCount: 0, schedule: ["Chờ lệnh", "Chờ lệnh", "Nghỉ", "Nghỉ"] });
          state.market = state.market.filter((candidate) => candidate.name !== item.name);
          syncHud();
          showToast(`${item.name} đã gia nhập danh sách.`);
          renderMenu();
          return;
        }

        if (event.target.closest("[data-recruit-talk]")) {
          showToast("Hội thoại phỏng vấn sẽ được vào từ đây sau.");
          return;
        }

        if (event.target.closest("[data-hire]")) {
          state.employees.push({ name: state.recruit.name, grade: "Người mới", area: "Tiền sảnh", status: "Chờ lệnh", dailySalary: state.recruit.ask, score: 50, serviceCount: 0, nominationCount: 0, extraCount: 0, schedule: ["Chờ lệnh", "Chờ lệnh", "Nghỉ", "Nghỉ"] });
          showToast(`${state.recruit.name} đã được tuyển dụng.`);
          state.recruit = { name: "Đang làm mới ứng viên", refresh: "12:00:00", count: 0, ask: 0, note: "Đang chờ ứng viên tiếp theo." };
          renderMenu();
          return;
        }

        if (event.target.closest("[data-reject]")) {
          state.recruit.count += 1;
          showToast("Đã từ chối, ứng viên quay lại kho nhân tài.");
          renderMenu();
          return;
        }

        if (event.target.closest("[data-close-day]")) {
          state.funds += state.settlement.gross;
          state.time = "00:00";
          state.nominations.forEach((item) => {
            item.remaining = Math.max(0, item.remaining - 1);
          });
          syncHud();
          showToast("Hôm nay đã kết toán.");
          renderMenu();
        }
      });

      syncHud();
      renderMenu();
    </script>
  </body>
</html>
